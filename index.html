<style>
  :root {
    --accent: #c4501a;
    --accent-2: #e8722f;
    --bg: #17110d;
    --bg-2: #211812;
    --card: #2a1f17;
    --line: #3b2c20;
    --text: #f6ede2;
    --mute: #b6a693;
    --ok: #7dbb6a;
    --bad: #d9694a;
    --serif: "Playfair Display", Georgia, serif;
    --sans: "Plus Jakarta Sans", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--sans);
    background: radial-gradient(120% 90% at 50% -10%, #2a1a10 0%, var(--bg) 55%);
    color: var(--text);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: max(24px, env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
  }
  .wrap { width: 100%; max-width: 460px; margin: auto 0; display: flex; flex-direction: column; align-items: center; }

  header { text-align: center; margin-bottom: 30px; }
  .logo { font-size: 40px; line-height: 1; }
  h1 { font-family: var(--serif); font-weight: 800; font-size: clamp(30px, 9vw, 42px); letter-spacing: -0.02em; margin-top: 10px; }
  h1 em { color: var(--accent-2); font-style: italic; }
  .sub { color: var(--mute); font-size: 14px; margin-top: 10px; line-height: 1.5; max-width: 30ch; margin-inline: auto; }

  .btn {
    font-family: var(--sans); font-weight: 700; font-size: 17px;
    color: #fff; background: linear-gradient(180deg, var(--accent-2), var(--accent));
    border: none; border-radius: 999px; padding: 17px 34px; cursor: pointer;
    box-shadow: 0 10px 30px -8px rgba(196, 80, 26, 0.7); transition: transform .12s, box-shadow .12s, opacity .12s;
    display: inline-flex; align-items: center; gap: 10px;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 14px 34px -8px rgba(196, 80, 26, 0.8); }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: .6; cursor: default; transform: none; }
  .btn--ghost { background: transparent; color: var(--text); border: 1px solid var(--line); box-shadow: none; font-weight: 600; font-size: 14px; padding: 12px 22px; }
  .btn--ghost:hover { border-color: var(--accent-2); }

  .status { color: var(--mute); font-size: 13px; margin-top: 18px; text-align: center; min-height: 18px; }
  .status.err { color: var(--bad); }

  /* Ruleta / spinner */
  .spinner { margin: 30px 0 6px; height: 44px; display: flex; align-items: center; gap: 12px; color: var(--mute); font-size: 15px; }
  .dice { width: 30px; height: 30px; border: 3px solid var(--line); border-top-color: var(--accent-2); border-radius: 50%; animation: spin .7s linear infinite; flex-shrink: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .roll-name { font-family: var(--serif); font-size: 18px; color: var(--text); font-style: italic; }

  /* Ficha resultado */
  .card {
    width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 22px;
    overflow: hidden; box-shadow: 0 24px 60px -20px rgba(0,0,0,.6); animation: rise .45s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.98); } }
  .gallery { display: flex; gap: 4px; aspect-ratio: 16/10; background: var(--bg-2); }
  .gallery img { flex: 1; min-width: 0; height: 100%; object-fit: cover; }
  .gallery.empty { align-items: center; justify-content: center; color: var(--mute); font-size: 13px; aspect-ratio: 16/6; }
  .card-body { padding: 20px; }
  .name { font-family: var(--serif); font-weight: 800; font-size: 26px; line-height: 1.1; letter-spacing: -0.01em; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
  .chip { font-size: 12px; font-weight: 600; padding: 5px 11px; border-radius: 999px; background: var(--bg-2); border: 1px solid var(--line); color: var(--mute); }
  .chip--open { color: var(--ok); border-color: color-mix(in oklab, var(--ok) 45%, transparent); }
  .chip--closed { color: var(--bad); border-color: color-mix(in oklab, var(--bad) 45%, transparent); }
  .chip--dist { color: var(--accent-2); border-color: color-mix(in oklab, var(--accent-2) 45%, transparent); }
  .platos-h { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); margin: 18px 0 8px; }
  .platos { display: flex; flex-wrap: wrap; gap: 6px; }
  .plato { font-size: 13px; padding: 6px 12px; border-radius: 10px; background: color-mix(in oklab, var(--accent) 14%, transparent); border: 1px solid color-mix(in oklab, var(--accent) 30%, transparent); color: var(--text); }
  .actions { display: flex; gap: 8px; margin-top: 20px; }
  .actions a { flex: 1; text-decoration: none; }
  .actions .btn { width: 100%; justify-content: center; }
  .again { margin-top: 18px; }

  .config-warn { margin-top: 22px; max-width: 34ch; text-align: center; font-size: 12.5px; color: var(--bad); line-height: 1.5; }
  code { font-family: ui-monospace, monospace; background: var(--bg-2); padding: 1px 5px; border-radius: 5px; font-size: .92em; }
  .footer { margin-top: 26px; font-size: 11px; color: #6a5a4a; text-align: center; }
  a { color: inherit; }
</style>

<body>
  <div class="wrap">
    <header>
      <div class="logo">🌶️</div>
      <h1>Tengo <em>Hambre</em></h1>
      <p class="sub">Pulsa y te mando al restaurante de mi lista más cercano que esté abierto ahora.</p>
    </header>

    <div id="app"></div>

    <div class="footer">Datos: lista personal · fotos y horarios: Google Maps<br>
      <a href="https://ko-fi.com/zaswear" target="_blank" rel="noopener noreferrer"
         aria-label="Invitar a un café en Ko-fi (abre en una ventana nueva)">☕ Invítame a un café</a></div>
  </div>

<script>
/* ─────────────────────────────────────────────────────────────────────
   CONFIG — pon aquí tu clave de Google Maps Platform (Places API (New) +
   Maps JavaScript API activadas, con billing). Restríngela por "HTTP
   referrer" a tu dominio (p. ej. zaswear.github.io/*) para que sea segura
   al viajar en el cliente.
   ───────────────────────────────────────────────────────────────────── */
const GOOGLE_MAPS_API_KEY = "AIzaSyB19Ddu6CTKIzI86IofXCMgqrTac9CyKvo";

const NEAREST_K = 25;      // candidatos más cercanos a considerar
const MAX_LOOKUPS = 12;    // tope de consultas a Places por ruleta (coste)
const PHOTO_COUNT = 3;     // fotos a mostrar

const app = document.getElementById("app");
let RESTAURANTS = [];
let PLATOS = {};
let userLoc = null;
let placesReady = null;

/* ---------- utilidades ---------- */
function haversine(a, b, c, d) {
  const R = 6371, r = Math.PI / 180;
  const dLat = (c - a) * r, dLon = (d - b) * r;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(a * r) * Math.cos(c * r) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x)); // km
}
function fmtDist(km) { return km < 1 ? `${Math.round(km * 1000)} m` : `${km.toFixed(1)} km`; }
function shuffle(arr) { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }
function platosDe(r) { return PLATOS[`${r.n}|${r.c}`] || []; }
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function hasKey() { return GOOGLE_MAPS_API_KEY && GOOGLE_MAPS_API_KEY !== "REPLACE_WITH_YOUR_KEY"; }

function nearest() {
  return RESTAURANTS
    .filter((r) => typeof r.lat === "number" && typeof r.lon === "number")
    .map((r) => ({ ...r, _dist: haversine(userLoc.lat, userLoc.lon, r.lat, r.lon) }))
    .sort((a, b) => a._dist - b._dist)
    .slice(0, NEAREST_K);
}

/* ---------- Google Places (API nueva) ---------- */
function loadPlaces() {
  if (placesReady) return placesReady;
  placesReady = new Promise((resolve, reject) => {
    if (!hasKey()) { reject(new Error("no-key")); return; }
    const useLib = () => window.google.maps.importLibrary("places")
      .then((lib) => resolve(lib.Place))
      .catch((e) => { console.warn("Places importLibrary falló:", e); reject(e); });
    if (window.google && window.google.maps && window.google.maps.importLibrary) { useLib(); return; }
    window.__gmapsInit = useLib;
    const s = document.createElement("script");
    s.src = `https://maps.googleapis.com/maps/api/js?key=${GOOGLE_MAPS_API_KEY}&v=weekly&libraries=places&loading=async&callback=__gmapsInit`;
    s.async = true;
    s.onerror = () => { console.warn("No se pudo cargar Maps JS (¿API/JS activada? ¿referrer?)"); reject(new Error("script")); };
    document.head.appendChild(s);
  });
  return placesReady;
}

async function fetchPlace(Place, r) {
  const { places } = await Place.searchByText({
    textQuery: `${r.n}, ${r.a}`,
    fields: ["displayName", "photos", "regularOpeningHours", "utcOffsetMinutes", "googleMapsURI", "rating", "location", "businessStatus"],
    maxResultCount: 1,
    locationBias: { center: { lat: r.lat, lng: r.lon }, radius: 2000 },
    language: "es",
  });
  return places && places[0] ? places[0] : null;
}

/* ---------- render ---------- */
function renderStart(msg, isErr) {
  app.innerHTML = `
    <button class="btn" id="go"><i class="ph-fill ph-fork-knife"></i> Tengo hambre</button>
    <button class="btn btn--ghost" id="crave" style="margin-top: 12px;"><i class="ph-fill ph-chat-circle"></i> Tengo un antojo</button>
    <div class="status ${isErr ? "err" : ""}">${msg || ""}</div>`;
  document.getElementById("go").onclick = start;
  document.getElementById("crave").onclick = startCraving;
}

function startCraving() {
  if (!navigator.geolocation) { renderStart("Tu navegador no soporta geolocalización.", true); return; }
  app.innerHTML = `<div class="status">Pidiendo tu ubicación…</div>`;
  navigator.geolocation.getCurrentPosition(
    (pos) => { userLoc = { lat: pos.coords.latitude, lon: pos.coords.longitude }; renderCravingUI(); },
    (err) => renderStart("No pude obtener tu ubicación. Reintenta.", true),
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
  );
}

function renderCravingUI() {
  app.innerHTML = `
    <div style="width:100%; display:flex; flex-direction:column; gap:12px;">
      <p style="font-family:var(--serif); font-size:22px; text-align:center;">¿De qué tienes antojo?</p>
      <input type="text" id="craving-input" placeholder="Ej: algo picante, comida mexicana..." style="padding:14px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--text); font-family:var(--sans); font-size:16px;">
      <button class="btn" id="ask-ai" style="justify-content:center;">Preguntar a la IA</button>
      <div id="ai-status" class="status"></div>
    </div>
  `;
  document.getElementById("ask-ai").onclick = async () => {
    const input = document.getElementById("craving-input").value.trim();
    if (!input) return;
    document.getElementById("ask-ai").disabled = true;
    await processCraving(input);
  };
}

async function processCraving(craving) {
  const statusEl = document.getElementById("ai-status");
  statusEl.innerText = "Preparando IA local...";
  
  try {
    const { CreateMLCEngine } = await import("https://esm.run/@mlc-ai/web-llm");
    const initProgressCallback = (report) => {
      statusEl.innerText = `Cargando modelo: ${Math.round(report.progress * 100)}% (${report.text})`;
    };
    
    // Gemma 2B is an excellent small model for this
    const engine = await CreateMLCEngine("gemma-2b-it-q4f32_1-MLC", { initProgressCallback });
    
    statusEl.innerText = "Pensando...";
    const pool = nearest().slice(0, 15);
    const catalog = pool.map(r => `- ${r.n} (${r.c}): ${platosDe(r).join(", ") || "sin platos"}`).join("\n");
    
    const prompt = `Eres un experto recomendador de restaurantes.
El usuario tiene este antojo: "${craving}".
Aquí tienes una lista de restaurantes cercanos (Nombre (Categoría): platos):
${catalog}

Elige EXACTAMENTE UNO que mejor satisfaga el antojo.
Responde ÚNICAMENTE con el nombre exacto del restaurante, tal y como aparece en la lista.`;

    const reply = await engine.chat.completions.create({
      messages: [{ role: "user", content: prompt }],
      temperature: 0.1, // Baja temperatura para que sea determinista y extraiga bien el nombre
    });
    
    const aiChoice = reply.choices[0].message.content.trim();
    
    // Buscar el restaurante elegido en el pool
    const chosen = pool.find(r => aiChoice.includes(r.n)) || pool[0]; // fallback
    
    // Girar la ruleta hasta él (para reutilizar la UI de resultado)
    spinTo(chosen);
  } catch(e) {
    statusEl.innerText = "Error: " + e.message;
    document.getElementById("ask-ai").disabled = false;
  }
}

async function spinTo(targetR) {
  let Place;
  try { Place = await loadPlaces(); } catch (e) {}
  renderSpin(targetR.n);
  
  let place = null, open = undefined;
  if (Place) {
    try {
      place = await fetchPlace(Place, targetR);
      if (place) { try { open = await place.isOpen(); } catch { open = undefined; } }
    } catch {}
  }
  
  let photos = [];
  try {
    if (place && place.photos) photos = place.photos.slice(0, PHOTO_COUNT).map((p) => p.getURI({ maxWidth: 640, maxHeight: 480 }));
  } catch {}
  
  setTimeout(() => renderResult(targetR, place, photos, open === true ? true : undefined), 600);
}

function renderSpin(name) {
  app.innerHTML = `
    <div class="spinner"><div class="dice"></div>
      <span>Girando la ruleta…${name ? ` <span class="roll-name">${esc(name)}</span>` : ""}</span></div>`;
}

function renderResult(r, place, photos, openState) {
  const platos = platosDe(r);
  const openChip = openState === true
    ? `<span class="chip chip--open">● Abierto ahora</span>`
    : openState === false
      ? `<span class="chip chip--closed">● Cerrado</span>`
      : `<span class="chip">Horario n/d</span>`;
  const maps = (place && place.googleMapsURI) || r.u;
  const gallery = photos.length
    ? `<div class="gallery">${photos.map((u) => `<img src="${esc(u)}" alt="Foto de ${esc(r.n)}" loading="lazy">`).join("")}</div>`
    : `<div class="gallery empty">Sin fotos de Google para este sitio</div>`;
  app.innerHTML = `
    <div class="card">
      ${gallery}
      <div class="card-body">
        <div class="name">${esc(r.n)}</div>
        <div class="chips">
          <span class="chip chip--dist" style="display:inline-flex;align-items:center;gap:4px"><i class="ph-fill ph-map-pin"></i>${fmtDist(r._dist)}</span>
          ${openChip}
          ${r.h ? `<span class="chip">${esc(r.h)}</span>` : ""}
          <span class="chip">${esc(r.c)}</span>
        </div>
        ${platos.length ? `<div class="platos-h">Qué pedir</div>
          <div class="platos">${platos.map((p) => `<span class="plato">${esc(p)}</span>`).join("")}</div>` : ""}
        <div class="actions">
          <a href="${esc(maps)}" target="_blank" rel="noopener"><button class="btn">Ir · Google Maps</button></a>
        </div>
      </div>
    </div>
    <button class="btn btn--ghost again" id="again"><i class="ph-fill ph-dice-five"></i> Otra</button>`;
  document.getElementById("again").onclick = spin;
}

function renderNoKey() {
  app.innerHTML = `
    <div class="config-warn">
      Falta la clave de Google. Pon tu API key en <code>GOOGLE_MAPS_API_KEY</code>
      dentro de <code>index.html</code> para ver fotos y el estado "abierto ahora".
    </div>
    <button class="btn btn--ghost again" id="anyway">Probar ruleta sin fotos</button>`;
  document.getElementById("anyway").onclick = spinNoPlaces;
}

/* ---------- flujo ---------- */
function start() {
  if (!navigator.geolocation) { renderStart("Tu navegador no soporta geolocalización.", true); return; }
  app.innerHTML = `<div class="status">Pidiendo tu ubicación…</div>`;
  navigator.geolocation.getCurrentPosition(
    (pos) => { userLoc = { lat: pos.coords.latitude, lon: pos.coords.longitude }; spin(); },
    (err) => {
      const msg = err.code === err.PERMISSION_DENIED
        ? "Necesito tu ubicación para encontrar el más cercano. Actívala y reintenta."
        : "No pude obtener tu ubicación. Reintenta.";
      renderStart(msg, true);
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
  );
}

async function spin() {
  const pool = shuffle(nearest());
  if (!pool.length) { renderStart("No hay restaurantes con coordenadas todavía.", true); return; }

  let Place;
  try { Place = await loadPlaces(); }
  catch (e) {
    if (e.message === "no-key") { renderNoKey(); return; }
    return spinNoPlaces(); // sin Places: ruleta básica
  }

  renderSpin();
  let chosen = null, chosenPlace = null, fallback = null, fallbackPlace = null;
  const attempts = Math.min(MAX_LOOKUPS, pool.length);
  for (let i = 0; i < attempts; i++) {
    const r = pool[i];
    renderSpin(r.n);
    let place = null, open;
    try {
      place = await fetchPlace(Place, r);
      if (place && place.businessStatus && place.businessStatus !== "OPERATIONAL") continue; // cerrado permanente
      if (place) { try { open = await place.isOpen(); } catch { open = undefined; } }
    } catch { /* ignora y sigue */ }
    if (!fallback) { fallback = r; fallbackPlace = place; }
    if (open === true) { chosen = r; chosenPlace = place; break; }
  }

  const r = chosen || fallback || pool[0];
  const place = chosen ? chosenPlace : fallbackPlace;
  let photos = [];
  try {
    if (place && place.photos) photos = place.photos.slice(0, PHOTO_COUNT).map((p) => p.getURI({ maxWidth: 640, maxHeight: 480 }));
  } catch { /* sin fotos */ }
  renderResult(r, place, photos, chosen ? true : undefined);
}

function spinNoPlaces() {
  const pick = shuffle(nearest())[0];
  if (!pick) { renderStart("No hay restaurantes con coordenadas todavía.", true); return; }
  renderSpin(pick.n);
  setTimeout(() => renderResult(pick, null, [], undefined), 600);
}

/* ---------- init ---------- */
(async function init() {
  try {
    const [rs, ps] = await Promise.all([
      fetch("./restaurants.json").then((r) => r.json()),
      fetch("./platos.json").then((r) => r.json()).catch(() => ({})),
    ]);
    RESTAURANTS = rs;
    PLATOS = ps;
    const geocoded = RESTAURANTS.filter((r) => typeof r.lat === "number").length;
    renderStart(geocoded ? "" : "Aún sin coordenadas — ejecuta geocode.js.", !geocoded);
  } catch (e) {
    renderStart("No pude cargar los datos.", true);
  }
})();
</script>
